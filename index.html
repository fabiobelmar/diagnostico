<style>
/* Layout: coluna única centrada, uma etapa por ecrã, cartões navy sobre fundo navy, chips de escolha */

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--body); font-size: 17px; line-height: 1.5; }
.wrap {
  max-width: 680px; margin: 0 auto;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 28px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); display: grid; place-items: center; overflow: hidden; flex: none; }
.logo span { font-family: var(--display); color: var(--blue); font-size: 20px; letter-spacing: .02em; }
.logo img { width: 100%; height: 100%; object-fit: contain; }
.brand b { display: block; font-weight: 700; font-size: 16px; line-height: 1.2; }
.brand small { color: var(--soft); font-size: 13px; }
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { font: 600 13px var(--body); color: var(--soft); background: none; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--blue); color: var(--blue-ink); }

.progress { margin-bottom: 22px; }
.progress .meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--soft); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--card); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; transition: width .3s ease; }

h1, h2 { font-family: var(--display); font-weight: 400; line-height: 1.08; margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 { font-size: clamp(34px, 8vw, 48px); }
h1 em, h2 em { font-style: normal; color: var(--blue); }
h2 { font-size: clamp(28px, 6.5vw, 38px); }
.lead { color: var(--soft); margin: 12px 0 0; max-width: 60ch; }
.points { display: grid; gap: 10px; margin: 26px 0 30px; padding: 0; list-style: none; }
.points li { display: flex; gap: 12px; align-items: flex-start; color: var(--fg); }
.points li::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--blue); margin-top: 8px; flex: none; }

.q { border-top: 1px solid var(--line); padding: 22px 0 4px; }
.q:first-of-type { border-top: 0; }
.q > .label { display: block; font-weight: 700; font-size: 18px; line-height: 1.35; margin-bottom: 4px; }
.q .req { color: var(--blue); }
.q .help { display: block; color: var(--mute); font-size: 14.5px; margin-bottom: 10px; }
.q .label + .chips, .q .label + input, .q .label + textarea { margin-top: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip span { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 9px 15px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--fg); font-size: 15.5px; line-height: 1.3; cursor: pointer; transition: border-color .15s, background .15s; }
.chip span::before { content: ""; width: 16px; height: 16px; flex: none; border: 1.5px solid var(--mute); border-radius: 50%; }
.chip input[type="checkbox"] + span::before { border-radius: 4px; }
.chip input:checked + span { border-color: var(--blue); background: rgba(0, 150, 255, .14); }
.chip input:checked + span::before { background: var(--blue); border-color: var(--blue); box-shadow: inset 0 0 0 3px var(--card); }
.chip input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
.chip span:hover { border-color: var(--blue); }

input[type="text"], input[type="tel"], input[type="email"], textarea {
  width: 100%; font: 400 16.5px var(--body); color: var(--fg); background: var(--card);
  border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
}
textarea { min-height: 96px; resize: vertical; }
input::placeholder, textarea::placeholder { color: var(--mute); }
input:focus, textarea:focus { outline: none; border-color: var(--blue); }
.other { margin-top: 10px; }
.err { color: var(--err); font-size: 14px; margin-top: 8px; }
.note { color: var(--mute); font-size: 13.5px; margin-top: 8px; }

.nav { display: flex; gap: 12px; justify-content: space-between; margin-top: 30px; flex-wrap: wrap; }
.btn { font: 700 16px var(--body); border-radius: 12px; padding: 14px 22px; min-height: 50px; cursor: pointer; border: 1.5px solid var(--blue); }
.btn.primary { background: var(--blue); color: var(--blue-ink); }
.btn.ghost { background: transparent; color: var(--fg); border-color: var(--line); }
.btn:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.btn.primary:hover { filter: brightness(1.08); }
.nav .btn.primary { margin-left: auto; }

.done-box { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 24px; display: grid; gap: 14px; }
.done-box .btn { width: 100%; text-align: center; text-decoration: none; display: inline-flex; justify-content: center; align-items: center; }
.done-box pre { white-space: pre-wrap; word-break: break-word; font: 400 14px/1.5 var(--body); color: var(--soft); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px; max-height: 280px; overflow: auto; margin: 0; user-select: all; }
.status { font-size: 14.5px; color: var(--soft); }
.foot { margin-top: 40px; color: var(--mute); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>

    { id: "quemproduz", type: "single", s: L("Quem cria o conteúdo"), l: L("Hoje, quem cria o conteúdo das redes sociais?"), show: a => svc(a, "social", "video"),

    { id: "material", type: "single", s: L("Fotos e vídeos"), l: L("Tem fotos e vídeos reais do negócio e dos trabalhos?"), show: a => svc(a, "social", "video", "trafego", "google"),

    { id: "site_atual", type: "single", s: L("Site atual"), l: L("Já tem site ou domínio?"), show: a => svc(a, "site"),
      o: opts("Tenho site e quero melhorar", "Tenho só o domínio", "Não tenho nada") },

    { id: "email", type: "email", s: L("E-mail"), l: L("E-mail") },

const KEY = "fb-diagnostico-v1";
const S = { lang: "br", step: -1, a: {}, o: {} };
const t = x => (x && typeof x === "object" && "br" in x) ? x[S.lang] : x;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const optsOf = q => Array.isArray(q.o) ? q.o : q.o[S.lang];
const visible = q => !q.show || q.show(S.a);

function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d) { S.a = d.a || {}; S.o = d.o || {}; S.saved = d.step ?? -1; if (d.lang) S.lang = d.lang; } } catch (e) {}
  const h = location.hash.replace("#", "");
  if (h === "pt" || h === "br") S.lang = h;
  else if (!S.saved && /^pt-PT/i.test(navigator.language || "")) S.lang = "pt";
}
function save() { try { localStorage.setItem(KEY, JSON.stringify({ a: S.a, o: S.o, step: S.step, lang: S.lang })); } catch (e) {} }

function field(q) {
  const req = q.req ? ' <span class="req" aria-hidden="true">*</span>' : "";
  const help = q.h ? `<span class="help" id="h-${q.id}">${esc(t(q.h))}</span>` : "";
  let body = "";
  if (q.type === "single" || q.type === "multi") {
    const type = q.type === "single" ? "radio" : "checkbox";
    const cur = S.a[q.id];
    body = `<div class="chips" role="${q.type === "single" ? "radiogroup" : "group"}" aria-labelledby="l-${q.id}">` +
      optsOf(q).map((op, i) => {
        const on = q.type === "single" ? cur === op.k : (cur || []).includes(op.k);
        return `<label class="chip"><input type="${type}" id="q-${q.id}-${i}" name="${q.id}" value="${esc(op.k)}"${on ? " checked" : ""}><span>${esc(t(op.l))}</span></label>`;
      }).join("") + `</div>`;
    const otherOn = q.other && (q.type === "single" ? cur === "outro" : (cur || []).includes("outro"));
    if (otherOn) body += `<input type="text" class="other" id="o-${q.id}" data-other="${q.id}" placeholder="${esc(t(UI.other))}" value="${esc(S.o[q.id])}">`;
  } else if (q.type === "textarea") {
    body = `<textarea id="q-${q.id}" name="${q.id}" placeholder="${esc(t(q.ph) || "")}">${esc(S.a[q.id])}</textarea>`;
  } else {
    const ac = { nome: "name", email: "email", whatsapp: "tel" }[q.id] || "off";
    body = `<input type="${q.type}" id="q-${q.id}" name="${q.id}" autocomplete="${ac}" placeholder="${esc(t(q.ph) || "")}" value="${esc(S.a[q.id])}">`;
  }
  const lab = (q.type === "single" || q.type === "multi") ? `<span class="label" id="l-${q.id}">${esc(t(q.l))}${req}</span>` : `<label class="label" id="l-${q.id}" for="q-${q.id}">${esc(t(q.l))}${req}</label>`;
  return `<div class="q" data-q="${q.id}">${lab}${help}${body}<div class="err" id="e-${q.id}" hidden></div></div>`;
}

function render() {
  const app = document.getElementById("app");
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === S.lang)));
  document.documentElement.lang = S.lang === "pt" ? "pt-PT" : "pt-BR";
  document.getElementById("foot").textContent = t(UI.foot);

  if (S.step === -1) {
    const resumable = S.saved > 0 && S.saved < STEPS.length;
    app.innerHTML = `<h1>${t(UI.introTitle)}</h1><p class="lead">${esc(t(UI.introLead))}</p>
      <ul class="points"><li>${esc(t(UI.p1))}</li><li>${esc(t(UI.p2))}</li><li>${esc(t(UI.p3))}</li><li>${esc(t(UI.p4))}</li></ul>
      <div class="nav">${resumable ? `<button type="button" class="btn ghost" id="restart">${esc(t(UI.restart))}</button>` : ""}
      <button type="button" class="btn primary" id="start">${esc(t(resumable ? UI.resume : UI.start))}</button></div>`;
    document.getElementById("start").onclick = () => go(resumable ? S.saved : 0);
    const r = document.getElementById("restart"); if (r) r.onclick = () => { S.a = {}; S.o = {}; S.saved = -1; go(0); };
    return;
  }
  if (S.step >= STEPS.length) return renderDone();

  const st = STEPS[S.step], n = STEPS.length;
  app.innerHTML = `<div class="progress"><div class="meta"><span>${esc(t(UI.step))} ${S.step + 1} ${esc(t(UI.of))} ${n}</span><span>${Math.round((S.step) / n * 100)}%</span></div>
      <div class="bar"><i style="width:${(S.step + 1) / n * 100}%"></i></div></div>
    <h2>${t(st.t)}</h2>
    <form id="f" novalidate>${st.qs.filter(visible).map(field).join("")}
      <div class="nav">${S.step > 0 ? `<button type="button" class="btn ghost" id="back">${esc(t(UI.back))}</button>` : ""}
      <button type="submit" class="btn primary" id="next">${esc(t(S.step === n - 1 ? UI.send : UI.next))}</button></div></form>`;
  const f = document.getElementById("f");
  f.addEventListener("change", onChange);
  f.addEventListener("input", onInput);
  f.addEventListener("submit", e => { e.preventDefault(); if (validate()) go(S.step + 1); });
  const b = document.getElementById("back"); if (b) b.onclick = () => go(S.step - 1);
}

function onChange(e) {
  const el = e.target, id = el.name; if (!id) return;
  const q = STEPS[S.step].qs.find(x => x.id === id); if (!q) return;
  if (q.type === "single") S.a[id] = el.value;
  else if (q.type === "multi") {
    const vals = [...document.querySelectorAll(`input[name="${id}"]:checked`)].map(i => i.value);
    if (q.max && vals.length > q.max) { el.checked = false; showErr(id, t(UI.maxed)); return; }
    S.a[id] = vals; showErr(id, "");
  }
  save();
  if ((q.type === "single" || q.type === "multi")) {
    const y = window.scrollY; const focusId = el.id;
    render(); window.scrollTo(0, y);
    const back = document.getElementById(focusId); if (back) back.focus({ preventScroll: true });
    const ot = document.getElementById("o-" + id); if (ot && el.value === "outro" && (el.checked)) ot.focus({ preventScroll: true });
  }
}
function onInput(e) {
  const el = e.target;
  if (el.dataset.other) S.o[el.dataset.other] = el.value;
  else if (el.name && (el.tagName === "TEXTAREA" || el.type === "text" || el.type === "tel" || el.type === "email")) S.a[el.name] = el.value;
  if (el.name) showErr(el.name, "");
  save();
}
function showErr(id, msg) { const e = document.getElementById("e-" + id); if (e) { e.textContent = msg; e.hidden = !msg; } }
function validate() {
  let first = null;
  STEPS[S.step].qs.filter(visible).forEach(q => {
    const v = S.a[q.id];
    const empty = q.type === "multi" ? !(v && v.length) : !(v && String(v).trim());
    if (q.req && empty) { showErr(q.id, t(UI.required)); first = first || q.id; }
  });
  if (first) { const el = document.querySelector(`[data-q="${first}"]`); el && el.scrollIntoView({ behavior: "smooth", block: "center" }); }
  return !first;
}
function go(i) { S.step = Math.max(-1, Math.min(i, STEPS.length)); S.saved = S.step; save(); render(); window.scrollTo(0, 0); if (S.step === STEPS.length) sendMail(); }

function answerText(q) {
  const v = S.a[q.id];
  if (q.type === "single" || q.type === "multi") {
    const list = q.type === "single" ? (v ? [v] : []) : (v || []);
    if (!list.length) return "";
    return list.map(k => {
      if (k === "outro") return (S.lang === "pt" ? "Outro" : "Outro") + (S.o[q.id] ? ": " + S.o[q.id].trim() : "");
      const op = optsOf(q).find(o => o.k === k); return op ? t(op.l) : k;
    }).join("; ");
  }
  return (v || "").trim();
}
function summary(plain) {
  const B = x => plain ? x : `*${x}*`;
  const lines = [B("Diagnóstico do negócio"), `${S.a.negocio || ""}${S.a.local ? " · " + S.a.local : ""} (${S.lang === "pt" ? "Portugal" : "Brasil"})`];
  STEPS.forEach((st, i) => {
    const rows = st.qs.filter(visible).map(q => { const a = answerText(q); return a ? `• ${t(q.s)}: ${a}` : ""; }).filter(Boolean);
    if (rows.length) lines.push("", B(`${i + 1}. ${t(st.t).replace(/<[^>]+>/g, "")}`), ...rows);
  });
  return lines.join("\n");
}

function renderDone() {
  const app = document.getElementById("app");
  const txt = summary();
  const wa = `https://wa.me/${CONFIG.WHATSAPP.replace(/\D/g, "")}?text=${encodeURIComponent(txt)}`;
  const name = esc((S.a.nome || "").trim().split(/\s+/)[0] || "");
  const hasMail = !!CONFIG.FORMSPREE_ID, ok = S.mailed || S.mailState === "ok";
  app.innerHTML = `<h1>${t(UI.doneTitle).replace("{n}", name)}</h1><p class="lead">${esc(t(hasMail && ok ? UI.doneLeadMail : UI.doneLead))}</p>
    <div class="done-box">
      <a class="btn ${hasMail && ok ? "ghost" : "primary"}" id="wa" href="${wa}" target="_blank" rel="noopener">${esc(t(hasMail && ok ? UI.waSecondary : UI.wa))}</a>
      <button type="button" class="btn ghost" id="copy">${esc(t(UI.copy))}</button>
      <div class="status" id="status" role="status"></div>
      <pre id="sum">${esc(txt)}</pre>
    </div>
    <div class="nav"><button type="button" class="btn ghost" id="edit">${esc(t(UI.edit))}</button></div>`;
  document.getElementById("copy").onclick = async () => {
    const st = document.getElementById("status");
    try { await navigator.clipboard.writeText(txt); st.textContent = t(UI.copied); }
    catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById("sum")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); st.textContent = t(UI.copyFail); }
  };
  document.getElementById("edit").onclick = () => go(0);
  const stt = document.getElementById("status");
  if (hasMail) stt.textContent = ok ? t(UI.mailOk) : S.mailState === "fail" ? t(UI.mailFail) : t(UI.sending);
}

async function sendMail() {
  if (!CONFIG.FORMSPREE_ID || S.mailed) return;
  S.mailState = "sending";
  const who = (S.a.nome || "").trim(), biz = (S.a.negocio || "").trim();
  const data = {
    _subject: `Novo diagnóstico: ${who || "sem nome"}${biz ? " – " + biz : ""} (${S.lang === "pt" ? "PT" : "BR"})`,
    Nome: who, WhatsApp: answerText(STEPS.flatMap(s => s.qs).find(q => q.id === "whatsapp")),
    "E-mail": (S.a.email || "").trim(), Negócio: biz, Versão: S.lang === "pt" ? "Portugal" : "Brasil",
    Respostas: "\n" + summary(true)
  };
  if (S.a.email) data._replyto = S.a.email;
  try {
    const r = await fetch(`https://formspree.io/f/${CONFIG.FORMSPREE_ID}`, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(data) });
    S.mailState = r.ok ? "ok" : "fail"; if (r.ok) S.mailed = true;
  } catch (e) { S.mailState = "fail"; }
  if (S.step === STEPS.length) renderDone();
}

document.querySelectorAll(".lang button").forEach(b => b.onclick = () => {
  S.lang = b.dataset.lang; try { history.replaceState(null, "", "#" + S.lang); } catch (e) { location.hash = S.lang; } save(); render();
});
window.addEventListener("hashchange", () => { const h = location.hash.replace("#", ""); if ((h === "pt" || h === "br") && h !== S.lang) { S.lang = h; render(); } });
if (CONFIG.LOGO_URL) document.getElementById("logo").innerHTML = `<img src="${esc(CONFIG.LOGO_URL)}" alt="Logo">`;
load(); render();
</script>

</body></html>
